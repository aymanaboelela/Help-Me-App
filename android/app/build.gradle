plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Signing material, when the person building has it.
//
// `android/key.properties` is git-ignored and never ships with the repository —
// see store/PUBLISHING.md for the four keys it must hold. Anyone who clones this
// project without it still gets a working `flutter build apk --release`; the
// build falls back to the debug key, which produces a binary that runs on a
// device but that Play will refuse. Only the owner's machine holds the real key.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// The single source of truth for the version is `version:` in pubspec.yaml.
// The Flutter tool writes it into local.properties on every build, so these two
// values must never be hardcoded here — a hardcoded versionCode is how you end
// up offering Play the same build number twice and having it rejected.
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.helpme.help"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        // flutter_local_notifications schedules with java.time, which needs
        // desugaring to run on the older API levels we still support.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.helpme.help"
        // API 24 is Flutter's floor, and comfortably above the API 23 floor for
        // the AES-GCM + RSA-OAEP path in flutter_secure_storage — which is what
        // actually encrypts the health cards. Do not lower it.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // The app ships exactly two languages; there is no reason to carry
        // AndroidX's other ~70 sets of strings into the bundle.
        resourceConfigurations += ['en', 'ar']
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigning
                ? signingConfigs.release
                : signingConfigs.debug

            // R8 shrinks the binary and strips the Java/Kotlin symbol names that
            // a `strings` pass over the APK would otherwise hand an attacker.
            // proguard-rules.pro holds the keeps the plugins need.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }
}

// Say so out loud rather than quietly shipping something un-updatable.
if (!hasReleaseSigning) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
            logger.warn(
                '\nWARNING: android/key.properties is missing, so this release build ' +
                'is signed with the DEBUG key.\nIt will install on a device, but Google ' +
                'Play will reject it. See store/PUBLISHING.md.\n'
            )
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
