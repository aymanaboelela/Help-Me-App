name: help_me
description: "Help Me — ساعِدني: a bilingual (Arabic/English) first-aid and emergency guide."
publish_to: 'none'

version: 2.0.0+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + persistence
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2

  # UI / branding
  flutter_svg: ^2.0.16
  flutter_rating_bar: ^4.0.1

  # Platform integrations
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  in_app_review: ^2.0.10
  flutter_tts: ^4.2.0
  quick_actions: ^1.1.0
  flutter_secure_storage: ^10.3.1
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  qr_flutter: ^4.1.0
  youtube_player_iframe: ^6.0.2
  flutter_native_contact_picker: ^0.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/illustrations/
    - assets/steps/
    - assets/photos/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800

# Every PNG below is generated from the SVGs in assets/branding by
# tool/render_branding.sh — regenerate those before running this.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icon_1024.png"
  adaptive_icon_background: "assets/branding/icon_background_1024.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground_1024.png"
  adaptive_icon_monochrome: "assets/branding/icon_monochrome_1024.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/icon_1024.png"
    background_color: "#FFFFFF"
    theme_color: "#E63946"
