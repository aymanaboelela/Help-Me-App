name: help_me
description: "Help Me — ساعِدني: a bilingual (Arabic/English) first-aid and emergency guide."
publish_to: 'none'

version: 2.0.0+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + persistence
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2

  # UI / branding
  flutter_svg: ^2.0.16
  flutter_rating_bar: ^4.0.1

  # Platform integrations
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  in_app_review: ^2.0.10
  flutter_tts: ^4.2.0
  quick_actions: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icon_1024.png"
  adaptive_icon_background: "#E63946"
  adaptive_icon_foreground: "assets/branding/icon_foreground_1024.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/icon_1024.png"
