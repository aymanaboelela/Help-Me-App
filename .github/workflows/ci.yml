name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Deliberately no `dart format --set-exit-if-changed` gate. This codebase
      # is written in the pre-3.8 formatter style; Dart 3.8 changed the default
      # to "tall style", which would rewrite 73 of 106 files. Reformatting them
      # would bury every future diff under whitespace and gain nothing. If the
      # project ever adopts tall style, do it in one commit of its own and add
      # the gate back in the next one.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      # A golden that fails writes its diff to test/failures/. Publishing it is
      # the difference between "a golden broke" and being able to see how.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore
          retention-days: 7

  build-android:
    name: Build Android (unsigned)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # No key.properties on CI, so build.gradle falls back to the debug key.
      # This proves the bundle *builds* — R8 rules, desugaring, manifest merge —
      # it does not produce anything that could be shipped to Play.
      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign
