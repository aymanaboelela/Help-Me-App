name: Secret scan

# This repository once carried a keystore password in a commented-out Gradle
# block. It was a placeholder rather than a live credential, but nothing in the
# pipeline noticed it for the entire time it sat in a public history. This job
# is what noticing looks like.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a leak introduced on a quiet branch still surfaces.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the whole history, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
