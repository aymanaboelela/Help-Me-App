<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img">
  <rect width="400" height="260" rx="24" fill="#F2F5F9"/>

  <!-- the rescuer's forearm and thigh, supporting the baby -->
  <path d="M66 128 L 306 214" stroke="#8B98A8" stroke-width="34" stroke-linecap="round"/>

  <!-- baby face down along the arm, head lower than the chest -->
  <path d="M124 138 L 250 182" stroke="#3A4553" stroke-width="46" stroke-linecap="round"/>
  <circle cx="278" cy="192" r="27" fill="#3A4553"/>

  <!-- five back blows between the shoulder blades, heel of the hand -->
  <rect x="152" y="88" width="52" height="26" rx="13" fill="#E8590C" transform="rotate(16 178 101)"/>
  <path d="M132 74 L 160 92" stroke="#E8590C" stroke-width="18" stroke-linecap="round"/>
  <g stroke="#C24A08" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M188 122 L 194 136"/>
    <path d="M208 128 L 212 142"/>
  </g>
</svg>
