<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img">
  <rect width="400" height="260" rx="24" fill="#F2F5F9"/>

  <!-- limb, shown from the body end down to the wound -->
  <path d="M200 34 V 226" stroke="#3A4553" stroke-width="66" stroke-linecap="round"/>

  <!-- the wound, low on the limb -->
  <circle cx="200" cy="192" r="19" fill="#D00000"/>
  <circle cx="200" cy="192" r="8" fill="#8A0000"/>

  <!-- band placed above the wound, between it and the body -->
  <rect x="152" y="106" width="96" height="30" rx="8" fill="#D00000"/>
  <rect x="146" y="72" width="108" height="20" rx="9" fill="#E63946" transform="rotate(-16 200 82)"/>
  <circle cx="200" cy="90" r="13" fill="#8A0000"/>

  <!-- twist the windlass until the bleeding stops -->
  <g stroke="#8A0000" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 76 A 44 44 0 0 1 296 122"/>
    <path d="M280 108 L 298 126 L 312 106"/>
  </g>
</svg>
