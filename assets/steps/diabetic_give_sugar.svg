  <path d="M238 142 L 246 202 A 16 16 0 0 0 262 216 H 288 A 16 16 0 0 0 304 202 L 312 142 Z" fill="#8E44AD"/>
  <path d="M300 84 L 268 168" stroke="#6B2E86" stroke-width="10" stroke-linecap="round"/>

  <!-- or plain sugar -->
