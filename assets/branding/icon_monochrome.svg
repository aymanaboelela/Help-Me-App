<!-- Help Me · ساعِدني — Android 13+ themed ("monochrome") icon layer.
     The launcher tints this silhouette with the user's wallpaper colours, so it
     must be one flat colour on transparency: the pulse is knocked out of the
     cross rather than drawn in red. Sized like icon_foreground.svg — full
     artwork size, because flutter_launcher_icons applies the 16% inset. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <path id="hm-cross" d="M226 108 h60 a26 26 0 0 1 26 26 v92 h92 a26 26 0 0 1 26 26 v60 a26 26 0 0 1 -26 26 h-92 v92 a26 26 0 0 1 -26 26 h-60 a26 26 0 0 1 -26 -26 v-92 h-92 a26 26 0 0 1 -26 -26 v-60 a26 26 0 0 1 26 -26 h92 v-92 a26 26 0 0 1 26 -26 z"/>
    <mask id="hm-knockout">
      <use href="#hm-cross" fill="#FFFFFF"/>
      <path d="M40 256 H186 L212 200 L248 312 L282 216 L302 256 H472"
            fill="none" stroke="#000000" stroke-width="22"
            stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
    <mask id="hm-outside">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <use href="#hm-cross" fill="#000000"/>
    </mask>
  </defs>

  <g>
    <rect width="512" height="512" fill="#FFFFFF" mask="url(#hm-knockout)"/>
    <path d="M40 256 H186 L212 200 L248 312 L282 216 L302 256 H472"
          fill="none" stroke="#FFFFFF" stroke-width="22"
          stroke-linecap="round" stroke-linejoin="round" mask="url(#hm-outside)"/>
  </g>
</svg>
